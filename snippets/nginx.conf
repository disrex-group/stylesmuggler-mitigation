# ============================================================
# StyleSmuggler mitigation — nginx
# ============================================================
# Blocks the second stage of the Magento/Adobe Commerce 0-day
# disclosed by Sansec on 2026-09-05.
#
#   https://sansec.io/research/stylesmuggler
#
# How to apply (you do this yourself, and test before reloading):
#   1. Copy this file to /etc/nginx/snippets/stylesmuggler.conf
#   2. Inside each Magento server { } block, add:
#        include /etc/nginx/snippets/stylesmuggler.conf;
#   3. Run: nginx -t     ← must pass before you reload anything
#
# Every pattern is matched raw AND URL-encoded. Captured payloads
# arrive percent-encoded (styles%5Bfirst%5D), so a rule matching
# only the literal bracket blocks nothing at all.
#
# 444 closes the connection without a response, which costs an
# automated scanner more than a 403 does. Swap it for 403 if you
# would rather see the blocks in your own access log.
# (access_log is not permitted inside `if {}` — blocked requests
#  still appear in the vhost's normal log.)
# ============================================================

# The gadget parameter. No legitimate Magento route uses it.
if ($query_string ~* "styles(\[|%5B)") {
    return 444;
}

# Object-injection driver parameters observed in the chain.
if ($query_string ~* "(generatorClass|with_resolved)") {
    return 444;
}

# Magento template directives smuggled through the query string.
# Real Magento URLs never carry these; a storefront search for the
# literal text getting blocked is an acceptable trade.
if ($query_string ~* "(\{\{|%7B%7B)\s*(block|config|trans|var|depend)") {
    return 444;
}

# Raw PHP open tag anywhere in the query string.
if ($query_string ~* "(<\?|%3C%3F)") {
    return 444;
}

# Raw PHP open tag in the User-Agent. One observed variant carried
# its entire payload there and aimed it at a poisoned log line,
# reaching an endpoint far too ordinary to block on its own.
if ($http_user_agent ~* "<\?(php|=)") {
    return 444;
}

# ------------------------------------------------------------
# OPTIONAL — disable GraphQL entirely (Sansec's own advice)
# ------------------------------------------------------------
# Uncomment ONLY where nothing consumes GraphQL. Headless/PWA
# storefronts and some checkout modules need it; most classic and
# Hyvä storefronts do not. Check before you commit:
#
#   grep -c '"POST /graphql' /path/to/access.log
#
# location ^~ /graphql {
#     return 403;
# }
