# ============================================================
# StyleSmuggler mitigation — Apache 2.4
# ============================================================
#
# LIMIT OF THIS APPROACH, READ IT: these rules only inspect the URL
# query string. Every attack seen in the wild puts the parameters
# there, so they stop the current campaign. But PHP merges GET and
# POST into $_REQUEST, so an attacker who moves the same parameters
# into the POST body is not blocked by anything below. Verified on a
# live store. Web servers cannot read bodies without ModSecurity/Lua.
#
# Apply these, then apply the CLI guard from README section 3, which
# sits on the sink and cannot be bypassed this way.
#
# Same rules as nginx/stylesmuggler.conf. Needs mod_rewrite.
#
#   https://sansec.io/research/stylesmuggler
#
# How to apply (you do this yourself, and test before reloading):
#   1. Copy to /etc/apache2/conf-available/stylesmuggler.conf
#   2. a2enconf stylesmuggler, then: apachectl configtest ← must pass first
#
# Or append the <IfModule> block to the store's .htaccess when you
# do not control the vhost.
#
# THE_REQUEST holds the raw request line, so it sees the query
# string exactly as sent, percent-encoding intact. %{QUERY_STRING}
# is decoded once by Apache, so both are checked.
# ============================================================

<IfModule mod_rewrite.c>
    RewriteEngine On

    # The gadget parameter, raw and URL-encoded.
    RewriteCond %{QUERY_STRING} (^|&)styles(\[|%5B) [NC,OR]
    RewriteCond %{THE_REQUEST}  styles(\[|%5B)      [NC]
    RewriteRule .* - [F,L]

    # Object-injection driver parameters.
    RewriteCond %{QUERY_STRING} (generatorClass|with_resolved) [NC,OR]
    RewriteCond %{THE_REQUEST}  (generatorClass|with_resolved) [NC]
    RewriteRule .* - [F,L]

    # Magento template directives in the query string.
    RewriteCond %{QUERY_STRING} (\{\{|%7B%7B)\s*(block|config|trans|var|depend) [NC,OR]
    RewriteCond %{THE_REQUEST}  (\{\{|%7B%7B)(block|config|trans|var|depend)    [NC]
    RewriteRule .* - [F,L]

    # Raw PHP open tag in the query string.
    RewriteCond %{QUERY_STRING} (<\?|%3C%3F) [NC,OR]
    RewriteCond %{THE_REQUEST}  (<\?|%3C%3F) [NC]
    RewriteRule .* - [F,L]

    # Raw PHP open tag in the User-Agent.
    RewriteCond %{HTTP_USER_AGENT} <\?(php|=) [NC]
    RewriteRule .* - [F,L]
</IfModule>

# ------------------------------------------------------------
# OPTIONAL — disable GraphQL entirely (Sansec's own advice)
# ------------------------------------------------------------
# <Location /graphql>
#     Require all denied
# </Location>
